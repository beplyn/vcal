[package]
name = "vcal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Vim-keybound terminal calendar backed by SQLite"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vcal"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
iana-time-zone = "0.1.65"
ratatui = "0.30"
roxmltree = "0.21"
rrule = "0.14.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = "3"
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
